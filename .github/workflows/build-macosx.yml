name: Build (Mac OS X PowerPC / Carbon)

on:
  push:
    paths:
      - 'src/core/**'
      - 'src/platform/macosx/**'
      - '.github/workflows/build-macosx.yml'
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/platform/macosx/**'
      - '.github/workflows/build-macosx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Rez resources (Retro68's Rez, flat data-fork output)
        run: |
          set -euo pipefail
          mkdir -p build
          docker run --rm \
            -v "${{ github.workspace }}:/root/iWordle" \
            -w /root/iWordle \
            ghcr.io/autc04/retro68 /bin/bash -c '
              set -euo pipefail
              /Retro68-build/toolchain/bin/Rez -DTARGET_API_MAC_CARBON=1 \
                src/platform/macosx/iWordle.r src/platform/macosx/icons.r \
                -I /Retro68-build/toolchain/powerpc-apple-macos/RIncludes \
                -o build/iWordle.rsrc
              # On Linux (no real resource forks), Rez writes a plain
              # ".rsrc"-named output using BasiliskIIs sidecar
              # convention: build/iWordle.rsrc itself only gets the
              # (empty) data fork, and the actual resource bytes land
              # in this hidden sibling file instead.
              cp build/.rsrc/iWordle.rsrc build/iWordle.rsrc
            '

      - name: Compile and link (powerpc-apple-darwin8 cross-compiler)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/root/iWordle" \
            -w /root/iWordle \
            -i ghcr.io/variantxyz/gcc-powerpc-apple-darwin8:build-gcc-14.2-MacOSXSDK10.4u /bin/bash <<'EOF'
          set -euo pipefail
          SDK=/usr/local/MacOSX10.4u.sdk
          CC=powerpc-apple-darwin8-gcc

          echo "--- toolchain sanity check ---"
          ls /usr/local/bin | grep powerpc-apple-darwin8 || true
          ls "$SDK" || (echo "SDK not found at $SDK" && find /usr/local -maxdepth 1 -iname '*sdk*' && exit 1)

          mkdir -p build
          CFLAGS="-arch ppc -isysroot $SDK -mmacosx-version-min=10.4 -Isrc/core -Wall"

          $CC $CFLAGS -c src/core/wordle_engine.c -o build/wordle_engine.o
          $CC $CFLAGS -c src/core/wordle_stats.c -o build/wordle_stats.o
          $CC $CFLAGS -c src/platform/macosx/main.c -o build/main.o

          $CC -arch ppc -isysroot "$SDK" -mmacosx-version-min=10.4 \
            build/wordle_engine.o build/wordle_stats.o build/main.o \
            -framework Carbon -framework CoreFoundation -o build/iWordle
          EOF

      - name: Extract Dock/Finder icon (.icns) from icons.r
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re

          content = open("src/platform/macosx/icons.r").read()
          m = re.search(r"data 'icns' \(128\) \{(.*?)\};", content, re.DOTALL)
          hex_str = "".join(re.findall(r'"([0-9A-Fa-f ]*)"', m.group(1))).replace(" ", "")
          data = bytes.fromhex(hex_str)

          assert data[:4] == b"icns", "bad magic"
          size = int.from_bytes(data[4:8], "big")
          assert size == len(data), "size mismatch"

          import os
          os.makedirs("build", exist_ok=True)
          open("build/iWordle.icns", "wb").write(data)
          PYEOF

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          APP=package/iWordle.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/iWordle "$APP/Contents/MacOS/iWordle"
          chmod +x "$APP/Contents/MacOS/iWordle"
          cp build/iWordle.rsrc "$APP/Contents/Resources/iWordle.rsrc"
          cp build/iWordle.icns "$APP/Contents/Resources/iWordle.icns"
          cp src/platform/macosx/Info.plist "$APP/Contents/Info.plist"
          cp src/platform/macosx/PkgInfo "$APP/Contents/PkgInfo"
          cd package
          zip -r -y iWordle-mac-os-x-ppc.zip iWordle.app

      - name: Build libdmg-hfsplus (open-source, makes a real HFS+ .dmg without a Mac)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y cmake libssl-dev zlib1g-dev libbz2-dev
          git clone --depth 1 https://github.com/mozilla/libdmg-hfsplus.git /tmp/libdmg-hfsplus
          cd /tmp/libdmg-hfsplus
          cmake .
          make -j2 dmg-bin hfsplus
          sudo install -m 755 dmg/dmg /usr/local/bin/dmg
          sudo install -m 755 hfs/hfsplus /usr/local/bin/hfsplus

      - name: Create .dmg
        run: |
          set -euo pipefail
          # This tool has no "create" verb -- it only operates on an
          # already-valid HFS+ image, so every real use of it (including
          # its own test suite) starts from this pre-built empty
          # template and grows it, rather than formatting one from
          # scratch.
          cp /tmp/libdmg-hfsplus/test/empty.hfs package/iWordle.hfs
          hfsplus package/iWordle.hfs grow 8388608
          # addall merges the CONTENTS of the source dir into an
          # already-existing destination folder on the volume -- it
          # doesn't create/rename that folder itself, so iWordle.app
          # has to be mkdir'd on the volume first or its bundle
          # contents would land loose at the volume root instead of
          # inside an iWordle.app folder.
          hfsplus package/iWordle.hfs mkdir /iWordle.app
          hfsplus package/iWordle.hfs addall package/iWordle.app /iWordle.app
          dmg build package/iWordle.hfs package/iWordle.dmg

      - name: Upload app bundle + disk image
        uses: actions/upload-artifact@v4
        with:
          name: iWordle-mac-os-x-ppc
          path: |
            package/iWordle-mac-os-x-ppc.zip
            package/iWordle.dmg
          if-no-files-found: error
