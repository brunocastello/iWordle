name: Build (Mac OS 9 PowerPC / Carbon)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Retro68 (Carbon / PowerPC toolchain)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/iWordle" \
            -w /root/iWordle \
            -i ghcr.io/autc04/retro68 /bin/bash <<'EOF'
          set -euo pipefail
          /Retro68-build/bin/interfaces-and-libraries.sh /Retro68-build/toolchain /root/iWordle/third_party/InterfacesAndLibraries
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/powerpc-apple-macos/cmake/retrocarbon.toolchain.cmake
          cmake --build . --verbose
          ls -la
          EOF

      - name: Package release assets (.sit archive + DiskCopy 4.2 image)
        run: |
          set -euo pipefail

          # sit reads AppleDouble sidecars named "._name" on Linux; Rez
          # already wrote the resource-fork half as "%iWordle.ad" (its
          # own AppleDouble naming convention) and the plain data fork as
          # "iWordle.ad" -- just rename both into place.
          git clone --depth 1 https://github.com/thecloudexpanse/sit.git /tmp/sit-src
          make -C /tmp/sit-src
          mkdir -p package
          cp build/iWordle.ad package/iWordle
          cp "build/%iWordle.ad" package/._iWordle
          /tmp/sit-src/sit -T APPL -C WRDL -o build/iWordle.sit package/iWordle

          python3 tools/make_diskcopy42.py build/iWordle.dsk build/iWordle-DiskCopy42.dsk iWordle

      - name: Upload disk image + app bundle
        uses: actions/upload-artifact@v4
        with:
          name: iWordle-mac-os-9-ppc
          path: |
            build/iWordle.dsk
            build/iWordle-DiskCopy42.dsk
            build/iWordle.APPL
            build/iWordle.bin
            build/iWordle.sit
          if-no-files-found: error
